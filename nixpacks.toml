# nixpacks.toml
[variables]
NIXPACKS_NODE_VERSION = "20"

[phases.setup]
nixPkgs = []
cmds = [
  "apt-get update && apt-get install -y --no-install-recommends ca-certificates curl gnupg openssl && mkdir -p /etc/apt/keyrings && curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg && echo 'deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_20.x nodistro main' > /etc/apt/sources.list.d/nodesource.list && apt-get update && apt-get install -y nodejs && rm -rf /var/lib/apt/lists/*",
  "node --version && npm --version"
]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npx prisma generate && npm run build"]

[start]
cmd = "npm start"
