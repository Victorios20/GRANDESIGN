# nixpacks.toml
[variables]
NIXPACKS_NODE_VERSION = "20"

# Se seu build realmente precisa dessas envs,
# o Nixpacks vai lê-las do arquivo .env que o EasyPanel gera (passo 3).

[phases.install]
cmd = "npm ci"

[phases.build]
# Gera o client do Prisma antes de compilar o Next
cmd = "npx prisma generate && npm run build"

[start]
cmd = "npm start"
